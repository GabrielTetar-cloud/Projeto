```yaml
name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  builds:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm install -g bats

      - run: bats -v

      - name: Python Lint Code Scanning Action
        run: |
          python -m pip install pylint
          pylint .
```
