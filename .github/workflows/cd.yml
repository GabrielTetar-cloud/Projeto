name: continous delivery

on:
  push:
    branches:
      - main

jobs:
  deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: simulando Continous delivery
        run: echo "Simulando Continous delivery"

      - name: Upload projeto
        uses: actions/upload-artifact@v7
        with:
          name: projetozipado
          path: |
            **/*.py
            README.md

  deploy:
    runs-on: ubuntu-latest
    needs: deliver

    steps:
      - name: Download projeto
        uses: actions/download-artifact@v8
        with:
          name: projetozipado

      - name: Display structure of download files
        run: ls -R
